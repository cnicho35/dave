name: Deploy MkDocs

on:
  pull_request:
    branches: [ros2]
  push:
    branches:
      - ros2
      - gh-pages
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for gh-pages branch

      - name: Fetch gh-pages branch
        run: git fetch origin gh-pages --depth=1 || true

      - name: Setup micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: docs/mkdocs-env.yaml
          environment-name: mkdocs-env
          cache-environment: true
          init-shell: bash

      - name: Deploy docs
        shell: bash -l {0}
        run: |
          micromamba activate mkdocs-env
          mkdocs gh-deploy --clean --config-file docs/mkdocs.yml
