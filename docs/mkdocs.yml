site_name: Robotics World for Marine Energy!
docs_dir: 'src'
site_dir: 'docs'
nav:
  - Home: 'index.md'
  - Learn:
    - Install and Verify: 'getting_started.md'
    - First Marine Energy Simulation: 'first_simulation.md'
    - Understand the Simulation Scene: 'simulation_scene.md'
  - Operate:
    - Operate the BlueROV: 'marine_energy_world.md'
    - Camera Evidence: 'camera_evidence.md'
    - Training Challenges: 'challenges.md'
    - Virtual Joystick: 'virtual_joystick.md'
  - Troubleshoot: 'troubleshooting.md'
  - Teach and Extend:
    - Instructor Guide: 'instructor_guide.md'
    - Customize a Scenario: 'customize_scenario.md'
  - Background:
    - DAVE: 'dave.md'
    - About: 'about.md'
    - Useful Links: 'links.md'
markdown_extensions:
  - footnotes
  - toc:
      permalink: true
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: "__span"
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
theme:
  name: material
  features:
    - content.code.copy
  palette:
    #primary: blue
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  plugins:
  - search
  - print-site
extra_css:
  - stylesheets/extra.css